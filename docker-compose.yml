services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: contoso-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  catalog:
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__CatalogDb: "Server=sqlserver,1433;Database=ContosoCatalog;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Authentication__Authority: ${AUTHENTICATION_AUTHORITY:?Set AUTHENTICATION_AUTHORITY in .env}
      Authentication__Audience: ${CATALOG_AUTH_AUDIENCE:?Set CATALOG_AUTH_AUDIENCE in .env}
    depends_on:
      - sqlserver
    ports:
      - "5276:8080"

  orders:
    build:
      context: .
      dockerfile: src/Services/Orders/Orders.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__OrdersDb: "Server=sqlserver,1433;Database=ContosoOrders;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Authentication__Authority: ${AUTHENTICATION_AUTHORITY:?Set AUTHENTICATION_AUTHORITY in .env}
      Authentication__Audience: ${ORDERS_AUTH_AUDIENCE:?Set ORDERS_AUTH_AUDIENCE in .env}
      Services__Catalog__BaseUrl: "http://catalog:8080/"
    depends_on:
      - sqlserver
      - catalog
    ports:
      - "5126:8080"

volumes:
  sqlserver-data:
