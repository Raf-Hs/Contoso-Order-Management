name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Contoso.OrderManagement.slnx

      - name: Build
        run: dotnet build Contoso.OrderManagement.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Contoso.OrderManagement.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
